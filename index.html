<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Paper 2 · All the best</title>
<style>
:root{--bg:#f5f5f7;--ink:#1d1d1f;--mut:#6e6e73;--card:rgba(255,255,255,.62);--edge:rgba(0,0,0,.08);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#07060f;--ink:#f5f5f7;--mut:#a1a1a6;--card:rgba(28,26,40,.5);--edge:rgba(255,255,255,.14);color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;display:grid;place-items:center;overflow:hidden;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(80px);opacity:.45}
.bg .a{background:#ff2d78;left:-20vmax;top:-20vmax;animation:m1 20s ease-in-out infinite alternate}
.bg .b{background:#0a84ff;right:-22vmax;top:-8vmax;animation:m2 24s ease-in-out infinite alternate}
.bg .c{background:#30d158;left:10vmax;bottom:-34vmax;animation:m3 22s ease-in-out infinite alternate;opacity:.35}
@keyframes m1{to{transform:translate(16vmax,12vmax)}}@keyframes m2{to{transform:translate(-14vmax,18vmax)}}@keyframes m3{to{transform:translate(18vmax,-10vmax)}}
main{position:relative;z-index:1;max-width:620px;text-align:center;padding:clamp(28px,6vw,56px);border-radius:30px;background:var(--card);-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);box-shadow:0 0 0 .5px var(--edge),0 30px 80px rgba(0,0,0,.18);animation:in 1s cubic-bezier(.2,.9,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(20px) scale(.97);filter:blur(6px)}}
.e{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
h1{margin:12px 0 14px;font-size:clamp(34px,7vw,56px);line-height:1.05;letter-spacing:-.03em;text-wrap:balance}
p{margin:0 auto;max-width:46ch;font-size:clamp(16px,2.2vw,19px);line-height:1.55;color:var(--mut)}
p+p{margin-top:12px}
@media (prefers-reduced-motion:reduce){.bg i,main{animation:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i></div>
<main>
<div class="e">DS4102 · Paper 2</div>
<h1>That’s a wrap. Well done, everyone.</h1>
<p>The study app has been taken down now that the exam is over. Thank you to everyone who studied here, quizzed each other and climbed the leaderboard.</p>
<p>Rest up, celebrate, and all the very best for your results and everything that comes next. 🦷✨</p>
</main>
</body>
</html>
